name: Build PS5 Payload

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile payload.elf (Prospero/FreeBSD clang toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDK prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev llvm-18-tools unzip

      - name: Install official PS5 payload SDK
        run: |
          curl -fsSL https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -o /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify ELF artifact
        run: |
          file payload.elf
          test -s payload.elf

      - name: Upload payload.elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload.elf
          path: payload.elf
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: payload.elf
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: payload.elf
