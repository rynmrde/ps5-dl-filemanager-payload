name: Build PS5 Payload

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile payload.elf (Prospero/FreeBSD clang toolchain)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps5-payload-dev/sdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain sanity check
        run: |
          echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK"
          ls "$PS5_PAYLOAD_SDK/toolchain/prospero/bin/clang"

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify ELF artifact
        run: |
          file payload.elf
          test -s payload.elf

      - name: Upload payload.elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload.elf
          path: payload.elf
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: payload.elf
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: payload.elf
